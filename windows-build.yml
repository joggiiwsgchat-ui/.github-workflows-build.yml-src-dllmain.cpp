name: build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: compile
        shell: cmd
        run: |
          cl.exe /LD /O2 /MT /GS- /EHs-c- /GR- /Fe:zerodelay.dll src/dllmain.cpp /link /DLL kernel32.lib
        env:
          PATH: ${{ env.PATH }}
      - uses: actions/upload-artifact@v4
        with:
          name: zerodelay
          path: zerodelay.dll
